name: Daily XP Claim

on:
  schedule:
    # Runs every 6 hours (UTC). Since the mini app has a 24-hour cooldown from
    # last click, running more frequently ensures you never miss the claim window.
    # The script treats "already claimed" as success, not an error.
    # Cron is in UTC — India time (IST) is UTC+5:30, shown in the logs below.
    - cron: "0 */6 * * *"
  workflow_dispatch:   # lets you run it manually from the Actions tab

permissions: {}

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show current time in India (IST)
        run: |
          python3 -c "
          from datetime import datetime, timezone, timedelta
          ist = timezone(timedelta(hours=5, minutes=30))
          now = datetime.now(ist)
          print(f'Current IST time: {now.strftime(\"%Y-%m-%d %I:%M %p\")}')
          print(f'UTC time: {datetime.now(timezone.utc).strftime(\"%Y-%m-%d %I:%M %p\")}')
          "

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -q telethon aiohttp backports.zstd

      - name: Claim XP (Method D — requestWebView, fully automated)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          TG_PHONE: ${{ secrets.TG_PHONE }}
          TG_BOT_USERNAME: ${{ secrets.TG_BOT_USERNAME }}
          TG_WEB_APP_URL: "https://app.piratezparty.com/"
          TG_CLAIM_URL: "https://app.piratezparty.com/api/daily"
        run: python claim-xp-requestwebview.py config.json

      - name: Upload logs (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xp-claim-logs
          path: |
            claim-xp.log
          retention-days: 5
